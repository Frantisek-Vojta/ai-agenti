<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Přehled tří AI agentů: Claude Code, GitHub Copilot a v0.">
  <title>AI agenti</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18202d;
      background: #f6f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 0%, #e8edff 0, transparent 48%), #f6f7fb;
    }

    main { width: min(100%, 620px); }

    .eyebrow {
      margin: 0 0 12px;
      color: #656f82;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.25rem);
      line-height: 1;
      letter-spacing: -0.065em;
    }

    .intro {
      margin: 18px 0 30px;
      color: #626d7f;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    ol {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: agents;
    }

    li {
      counter-increment: agents;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 76px;
      padding: 16px 20px;
      border: 1px solid #e5e8ef;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 14px rgba(24, 32, 45, 0.035);
      font-size: 1.08rem;
      font-weight: 650;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    li::before {
      content: "0" counter(agents);
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      border-radius: 12px;
      background: #eef0ff;
      color: #5146d8;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.02em;
    }

    li:hover {
      transform: translateY(-2px);
      border-color: #cdd1fa;
      box-shadow: 0 10px 24px rgba(24, 32, 45, 0.07);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Nástroje pro vývoj</p>
    <h1>AI agenti</h1>
    <p class="intro">Tři pomocníci, kteří usnadňují práci s kódem.</p>
    <ol aria-label="Seznam AI agentů">
      <li>Claude Code</li>
      <li>GitHub Copilot</li>
      <li>v0</li>
    </ol>
  </main>
</body>
</html>
